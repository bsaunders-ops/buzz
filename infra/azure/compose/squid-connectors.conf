visible_hostname core-buzz-connector-egress
http_port 3128
access_log none
cache_log /dev/null
cache_store_log none
cache deny all
acl SSL_ports port 443
acl CONNECT method CONNECT
acl approved_connector_hosts dstdomain \
  login.microsoftonline.com \
  graph.microsoft.com \
  oauth2.googleapis.com \
  www.googleapis.com \
  docs.googleapis.com \
  sheets.googleapis.com \
  slides.googleapis.com \
  crm.coreadvs.com
http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow approved_connector_hosts
http_access deny all
